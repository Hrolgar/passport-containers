name: CI and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with: { name: passport-unsigned, path: dist/*.zip }

  publish:
    # Publishing is explicit: push a v-tag matching the manifest version, or press "Run workflow".
    # Every upload restarts Mozilla's review, so main itself never publishes.
    needs: check
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci
      - name: Version must be new (and match the tag, if tagged)
        id: v
        run: |
          V=$(node -p "require('./src/manifest.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/* && "$GITHUB_REF_NAME" != "v$V" ]]; then echo "tag $GITHUB_REF_NAME != manifest v$V"; exit 1; fi
          if [[ "$GITHUB_REF" != refs/tags/* ]] && git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null; then echo "v$V already released, bump the manifest first"; exit 1; fi
      - name: Submit listed version to addons.mozilla.org
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_JWT_ISSUER }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_JWT_SECRET }}
        run: npx web-ext sign -s src -a dist --channel listed --amo-metadata amo-metadata.json --approval-timeout 0
      - name: Tag (if not already) and GitHub release
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          V=${{ steps.v.outputs.version }}
          npm run build
          git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null || { git tag "v$V" && git push origin "v$V"; }
          gh release create "v$V" dist/*.zip --title "v$V" --generate-notes
