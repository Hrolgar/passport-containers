<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="ui.css"><style>
body{width:372px;padding:12px}
header{display:flex;align-items:center;gap:8px;margin-bottom:6px}header img{width:20px;height:20px}header .sp{flex:1}
#tabinfo{font-size:12px;color:var(--muted)}
</style></head><body>
<header><img src="icons/passport.svg" alt=""><h1>Passport</h1><span class="sp"></span><span id="tabinfo"></span><button class="ghost" id="opt" title="All rules and keywords">&#9881;</button></header>
<div class="card" id="pausebar" style="display:flex;align-items:center;gap:8px;padding:6px 10px;margin-bottom:8px"><label class="toggle" style="margin:0"><input type="checkbox" id="pause"> Paused: no routing until resumed</label></div>
<div class="row" style="border:0;padding:0 0 4px"><span class="tag">Reopen in</span><span class="body" id="reopen" style="white-space:normal"></span></div>
<h2>On this site</h2>
<div class="card" id="have"><small>Nothing yet.</small></div>
<h2>Add</h2>
<div class="card">
  <div class="split">
    <div class="field" style="margin-top:0"><label>Keyword <small>(%s in the URL takes words after it)</small></label><input id="keyword" placeholder="pdb" autocomplete="off"></div>
    <div class="field" style="margin-top:0"><label>Opens in</label><select id="container"></select></div>
  </div>
  <input id="newname" class="hidden" placeholder="New container name" style="margin-top:6px">
  <label class="toggle"><input type="checkbox" id="bm" checked> Bookmark it</label>
  <div id="bmbox">
    <div class="split">
      <div class="field"><label>Title</label><input id="title"></div>
      <div class="field"><label>Folder</label><select id="folder"></select></div>
    </div>
    <label class="toggle"><input type="checkbox" id="hint"> Bookmark opens in this container <small>(?passport= in its URL)</small></label>
  </div>
  <label class="toggle"><input type="checkbox" id="rule"> Rule: always open this site here</label>
  <div class="muted" style="margin:2px 0 0 24px;font-size:12px"><span class="k" id="patlabel"></span> <a href="#" id="editpat">edit</a></div>
  <input id="pattern" class="hidden" style="margin-top:6px">
  <div class="actions"><button class="primary" id="add">Add</button><span id="msg" class="msg"></span><span id="err" class="err"></span></div>
</div>
<script src="popup.js"></script></body></html>
