<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#25446f"/><stop offset="1" stop-color="#132a4a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f3cf6a"/><stop offset="1" stop-color="#c9971f"/></linearGradient>
  </defs>
  <!-- passport booklet -->
